# Renders the manuscript on every push and PR. Behavior — multi-format
# render, latest at `/`, PR preview at `/pr/<n>/`, generated `/versions/`
# page, sticky PR comment with preview links — lives in the upstream
# reusable workflow. Bug fixes there flow here automatically via the
# version pin.
#
# To customize the pipeline, override inputs below (`formats`,
# `manuscript-name`, etc.). See:
#   https://github.com/quartobot/quartobot/blob/main/.github/workflows/render-reusable-lean.yml
# for the full list of inputs.
#
# To opt into the manubot-style per-commit permalink pipeline (with
# `/v/<sha>/` deploys, snapshot retention, version banner), regenerate
# this file with `quartobot use github-ci --with-versioned-snapshots`,
# or change the `uses:` line below to `render-reusable.yml@main`.

name: Render manuscript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    uses: quartobot/quartobot/.github/workflows/render-reusable-lean.yml@main
    permissions:
      contents: write
      pull-requests: write
    # Override defaults here, e.g.:
    #   with:
    #     formats: "html,pdf"
    #     manuscript-name: "my-paper"
    #     quarto-version: "1.5.57"
